[project]
name = "89books"
version = "0.1.0"
description = "Turn a folder of bookshelf photos into a self-contained, shareable HTML shelf with a reader portrait"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "pillow>=10",
    "pillow-heif>=1.8.1",
    "pyyaml>=6",
]

[project.scripts]
shelf = "shelf.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shelf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Line length is left to the formatter; prompts are long prose lines on purpose.
ignore = ["E501"]
